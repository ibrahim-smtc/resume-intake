<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audit Log</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #fff; color: #1a1a1a;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 16px; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 20px; }
    a { color: #1a56db; font-size: 14px; }
    button { font: inherit; font-size: 14px; padding: 6px 12px; border: 1px solid #ccc; border-radius: 6px;
      background: #fff; cursor: pointer; }
    button:hover { background: #f2f2f2; }
    .summary { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
    .chip { padding: 6px 12px; border-radius: 6px; font-size: 13px; background: #f3f3f3; }
    .chip b { font-weight: 600; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; vertical-align: top; }
    th { font-weight: 600; color: #555; white-space: nowrap; }
    td.reason { min-width: 260px; }
    td.nowrap { white-space: nowrap; }
    .dec { display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: 600; font-size: 12px; white-space: nowrap; }
    .good { background: #e3f4e6; color: #17612b; }
    .warn { background: #fff1d6; color: #7a5200; }
    .bad { background: #fbe4e4; color: #8f2020; }
    .muted { color: #888; }
    #empty { margin-top: 24px; color: #666; font-size: 14px; }
  </style>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
</head>
<body>
  <main>
    <header>
      <h1>Audit log</h1>
      <span><button id="refresh" type="button">Refresh</button> &nbsp; <a href="/trace">Traces</a> &nbsp; <a href="/">Back to upload</a></span>
    </header>
    <div class="summary" id="summary"></div>
    <div class="table-wrap">
      <table id="table" hidden>
        <thead><tr><th>Time</th><th>File</th><th>Step</th><th>Decision</th><th>Reason</th><th>Questlight ID</th><th>Run</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="empty" hidden>Nothing logged yet. Upload a resume and it will show up here.</div>
  </main>

  <script>
    const GOOD = ["accepted", "ok", "created"];
    const BAD = ["junk", "error", "failed"];

    function el(tag, text, cls) {
      const n = document.createElement(tag);
      if (text !== undefined && text !== null) n.textContent = text;
      if (cls) n.className = cls;
      return n;
    }

    function decisionBadge(d) {
      return el("span", d, "dec " + (GOOD.includes(d) ? "good" : BAD.includes(d) ? "bad" : "warn"));
    }

    function chip(label, n) {
      const c = el("div", undefined, "chip");
      c.appendChild(el("b", n));
      c.appendChild(document.createTextNode(" " + label));
      return c;
    }

    async function load() {
      const resp = await fetch("/api/log?limit=300");
      const { summary, rows } = await resp.json();

      const sum = document.getElementById("summary");
      sum.replaceChildren();
      const j = summary.junk_check || {}, l = summary.load_questlight || {};
      const total = Object.values(j).reduce((a, b) => a + b, 0);
      sum.appendChild(chip("resumes checked", total));
      sum.appendChild(chip("junk", j.junk || 0));
      sum.appendChild(chip("needs review", j.needs_review || 0));
      sum.appendChild(chip("accepted", j.accepted || 0));
      sum.appendChild(chip("profiles created", l.created || 0));
      sum.appendChild(chip("missing information", l.not_created || 0));
      sum.appendChild(chip("duplicates", l.duplicate || 0));
      sum.appendChild(chip("errors", Object.values(summary).reduce((a, s) => a + (s.error || 0) + (s.failed || 0), 0)));

      const body = document.getElementById("rows");
      body.replaceChildren();
      document.getElementById("table").hidden = rows.length === 0;
      document.getElementById("empty").hidden = rows.length !== 0;
      for (const r of rows) {
        const tr = document.createElement("tr");
        const when = el("td", new Date(r.ts).toLocaleString(), "nowrap");
        const file = el("td", r.file);
        file.title = r.file_hash ? "sha256 " + r.file_hash : "";
        const dec = el("td"); dec.appendChild(decisionBadge(r.decision));
        const reason = el("td", r.reason, "reason");
        if (r.details) reason.title = JSON.stringify(r.details);
        const runCell = el("td", undefined, "nowrap");
        const runLink = el("a", r.run_id);
        runLink.href = "/trace?id=" + encodeURIComponent(r.run_id);
        runLink.title = "Open this upload's step trace (time and tokens)";
        runCell.appendChild(runLink);
        tr.append(when, file, el("td", r.step, "nowrap"), dec, reason, el("td", r.record_id || "", "nowrap"), runCell);
        body.appendChild(tr);
      }
    }

    document.getElementById("refresh").addEventListener("click", load);
    load();
  </script>
</body>
</html>
