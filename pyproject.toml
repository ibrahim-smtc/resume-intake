[project]
name = "resume-intake"
version = "0.1.0"
description = "Resume and JD intake service and MCP server for Questlight"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0",
    "pypdf>=6",
    "pypdfium2>=5",
    "mcp>=1.29,<2",
    "pymongo>=4.8,<5",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "app.main:app"

[tool.pyright]
include = ["app", "run.py"]
venvPath = "."
venv = ".venv"
